<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70" fill="none">
  <!-- Back note -->
  <rect x="8" y="10" width="104" height="52" rx="8" fill="#10B981" opacity="0.3" transform="rotate(-3 60 36)" />
  <!-- Middle note -->
  <rect x="8" y="8" width="104" height="52" rx="8" fill="#059669" opacity="0.6" transform="rotate(-1 60 35)" />
  <!-- Front note -->
  <rect x="8" y="10" width="104" height="52" rx="8" fill="#047857" stroke="#34D399" stroke-width="2" />
  
  <!-- Inner border decorative -->
  <rect x="14" y="15" width="92" height="42" rx="5" fill="none" stroke="#6EE7B7" stroke-width="1.2" stroke-dasharray="3 2" />
  
  <!-- Corner details -->
  <circle cx="20" cy="21" r="3" fill="#A7F3D0" opacity="0.7" />
  <circle cx="100" cy="21" r="3" fill="#A7F3D0" opacity="0.7" />
  <circle cx="20" cy="51" r="3" fill="#A7F3D0" opacity="0.7" />
  <circle cx="100" cy="51" r="3" fill="#A7F3D0" opacity="0.7" />
  
  <!-- Central Emblem -->
  <ellipse cx="60" cy="36" rx="16" ry="16" fill="#065F46" stroke="#34D399" stroke-width="1.5" />
  <!-- Currency symbol -->
  <text x="60" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ECFDF5" text-anchor="middle">$</text>
  
  <!-- Subtitle CASH -->
  <text x="60" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#A7F3D0" letter-spacing="2" text-anchor="middle">ESPÈCES</text>
</svg>
